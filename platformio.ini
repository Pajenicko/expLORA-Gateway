[platformio]
extra_configs = variants/*/platformio.ini

[common]
lib_deps =
    bblanchon/ArduinoJson @ 6.21.6
    ; Exact registry version: it satisfies ESPAsyncWebServer's own dependency
    ; (^3.3.8), so no newer AsyncTCP is installed next to it for the library
    ; finder to pick (scripts/patch_asyncwebserver.py needs 3.3.8 and stops
    ; the build on any other)
    esp32async/AsyncTCP @ 3.3.8
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.7.4
    knolleary/PubSubClient @ ^2.8
    jgromes/RadioLib @ 7.8.1

build_flags =
        -I variants/${PIOENV}
        ; Task stacks (bytes), sized from the measured high-water marks with
        ; >= 3 kB (async_tcp) / >= 1.5 kB headroom: the web server task used
        ; at most 4.5 kB of its default 16 kB, the network event task 1.3 kB of 4 kB
        -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
        -D ARDUINO_NETWORK_EVENT_TASK_STACK_SIZE=3072
        ; Smaller WiFi driver buffers (src/Network/DriverConfig.cpp)
        -Wl,--wrap=esp_wifi_init

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino

; Header limits for ESPAsyncWebServer (see the script)
extra_scripts =
    pre:scripts/patch_asyncwebserver.py
    post:scripts/check_wraps.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs

; Partition scheme
board_build.partitions = partitions/huge_app_littlefs.csv

; Host-side unit tests: PlatformIO's `native` platform compiles with the
; host toolchain so pure C++ headers (no Arduino deps) can be exercised
; without flashing. Run with: pio test -e native
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = no
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*>
; Same ArduinoJson as the firmware (test_sensors_json)
lib_deps = bblanchon/ArduinoJson @ 6.21.6
