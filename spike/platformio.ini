; Protocol v2 milestone M0 timing spike (throw-away, see spike/README.md).
; Not built by CI; the production radio task replaces it in M2a.
;   pio run -e pro_spike -t upload --upload-port /dev/cu.usbserial-10
;   pio run -e lite_spike -t upload --upload-port /dev/cu.usbserial-210

[spike]
build_flags =
    -DSPIKE_PINGPONG
    -DMQTT_RECONNECT_INTERVAL=5000
    -I spike/gateway
build_src_filter = +<*> +<../spike/gateway/>

[env:pro_spike]
extends = env:pro
build_flags =
    -I variants/pro
    ${spike.build_flags}
build_src_filter = ${spike.build_src_filter}

[env:lite_spike]
extends = env:lite
build_flags =
    -I variants/lite
    ${spike.build_flags}
build_src_filter = ${spike.build_src_filter}
