; PlatformIO Project Configuration File
[env:pro]
board = esp32dev

; ESP32-WROOM-32E-N16: 16 MB flash, no PSRAM
board_upload.flash_size = 16MB
board_build.partitions = partitions/pro_16MB.csv

; CH340C is not reliable at 921600
upload_speed = 460800

build_flags =
	${common.build_flags}
	; Smaller LTE modem UART buffers (src/Network/DriverConfig.cpp)
	-Wl,--wrap=esp_modem_new_dev

lib_deps =
	${common.lib_deps}
