; PlatformIO Project Configuration File
[env:lite]
board = esp32-s3-devkitc-1

; Partition layout v2 (two 2752K app slots); units with layout v1
; (partitions/huge_app_littlefs.csv) are migrated in place at boot
; (src/Update/LayoutMigration.h)
board_build.partitions = partitions/lite_8MB_v2.csv

; SPI settings for ESP32-S3 (8MB flash)
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Build options
build_flags =
	${common.build_flags}
#    -D BOARD_HAS_PSRAM

; PSRAM settings for ESP32-S3
board_build.arduino.memory_type = qio_qspi

lib_deps =
	${common.lib_deps}
